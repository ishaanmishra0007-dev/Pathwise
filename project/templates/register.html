{% extends "base.html" %}

{% block title %}Sign Up | PathWise{% endblock %}

{% block content %}

<style>
    .signup-page {
        min-height: calc(100vh - 115px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
    }

    .signup-card {
        width: 100%;
        max-width: 390px;
        background: #ffffff;
        border: 1px solid #e3e7ec;
        border-radius: 12px;
        padding: 30px 34px;
        box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
    }

    .signup-header {
        text-align: center;
        margin-bottom: 24px;
    }

    .brand-mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 14px;
        border-radius: 10px;
        background: #1f5f9b;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
    }

    .signup-header h1 {
        margin: 0 0 6px;
        font-size: 26px;
        color: #172033;
    }

    .signup-header p {
        margin: 0;
        color: #6b7280;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 16px;
    }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
    }

    .form-input {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        font-size: 14px;
        outline: none;
    }

    .form-input:focus {
        border-color: #1f5f9b;
        box-shadow: 0 0 0 3px rgba(31, 95, 155, 0.1);
    }

    .signup-button {
        width: 100%;
        padding: 12px;
        margin-top: 2px;
        border: none;
        border-radius: 7px;
        background: #1f5f9b;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }

    .signup-button:hover {
        background: #174b7c;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 20px 0;
        color: #9ca3af;
        font-size: 12px;
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e5e7eb;
    }

    .login-text {
        text-align: center;
        margin: 0;
        color: #6b7280;
        font-size: 13px;
    }

    .login-text a {
        color: #1f5f9b;
        font-weight: 600;
        text-decoration: none;
    }

    .signup-note {
        text-align: center;
        margin-top: 15px;
        color: #9ca3af;
        font-size: 11px;
    }
</style>


<div class="signup-page">

    <div>

        <div class="signup-card">

            <div class="signup-header">

                <div class="brand-mark">
                    PW
                </div>

                <h1>Create your account</h1>

                <p>
                    Start your personalized learning journey.
                </p>

            </div>


            <form method="POST"
                  action="{{ url_for('main.register') }}">

                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-input"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button type="submit" class="signup-button">
                    Create Account
                </button>

            </form>


            <div class="divider">
                <span>or</span>
            </div>


            <p class="login-text">
                Already have an account?
                <a href="{{ url_for('main.login') }}">
                    Login
                </a>
            </p>

        </div>


        <p class="signup-note">
            PathWise · Personalized Learning Path System
        </p>

    </div>

</div>

{% endblock %}
