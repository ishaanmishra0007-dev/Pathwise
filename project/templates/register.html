{% extends "base.html" %}

{% block title %}Sign Up | PathWise{% endblock %}

{% block content %}

<style>

    .signup-page {
        min-height: calc(100vh - 136px);

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 35px 20px;
    }


    .signup-container {
        width: 100%;
        max-width: 450px;
    }


    /* =========================
       SIGNUP CARD
    ========================= */

    .signup-card {
        width: 100%;

        background: #ffffff;

        border: 1px solid #dce2dc;

        border-radius: 12px;

        padding: 35px 38px;

        box-shadow:
            0 8px 25px rgba(32, 41, 35, 0.07);
    }


    /* =========================
       HEADER
    ========================= */

    .signup-header {
        text-align: center;

        margin-bottom: 25px;
    }


    .brand-mark {
        width: 54px;
        height: 54px;

        margin: 0 auto 16px;

        border-radius: 11px;

        background: #3f6b57;

        color: #ffffff;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 20px;
        font-weight: 700;
    }


    .signup-header h1 {
        margin: 0 0 7px;

        color: #202923;

        font-size: 27px;
        font-weight: 700;
    }


    .signup-header p {
        margin: 0;

        color: #68736b;

        font-size: 14px;

        line-height: 1.5;
    }


    /* =========================
       FORM
    ========================= */

    .signup-form {
        display: flex;

        flex-direction: column;

        gap: 17px;
    }


    .form-group {
        display: flex;

        flex-direction: column;

        gap: 7px;
    }


    .form-group label {
        color: #37423b;

        font-size: 14px;

        font-weight: 600;
    }


    .form-input {
        width: 100%;

        box-sizing: border-box;

        height: 48px;

        padding: 0 13px;

        border: 1px solid #cfd8d1;

        border-radius: 7px;

        background: #ffffff;

        color: #202923;

        font-family: inherit;

        font-size: 14px;

        outline: none;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }


    .form-input::placeholder {
        color: #9aa49d;
    }


    .form-input:focus {
        border-color: #3f6b57;

        box-shadow:
            0 0 0 3px rgba(63, 107, 87, 0.10);
    }


    /* =========================
       BUTTON
    ========================= */

    .signup-button {
        width: 100%;

        height: 48px;

        margin-top: 2px;

        border: none;

        border-radius: 7px;

        background: #3f6b57;

        color: #ffffff;

        font-family: inherit;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;

        transition: background 0.2s ease;
    }


    .signup-button:hover {
        background: #315442;
    }


    /* =========================
       LOGIN LINK
    ========================= */

    .login-divider {
        display: flex;

        align-items: center;

        gap: 12px;

        margin: 23px 0 20px;

        color: #9aa49d;

        font-size: 13px;
    }


    .login-divider::before,
    .login-divider::after {
        content: "";

        flex: 1;

        height: 1px;

        background: #e1e5e1;
    }


    .login-text {
        margin: 0;

        text-align: center;

        color: #68736b;

        font-size: 14px;
    }


    .login-text a {
        color: #3f6b57;

        font-weight: 600;

        text-decoration: none;
    }


    .login-text a:hover {
        text-decoration: underline;
    }


    /* =========================
       NOTE
    ========================= */

    .signup-note {
        margin: 16px 0 0;

        text-align: center;

        color: #9aa49d;

        font-size: 11px;

        line-height: 1.5;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

        .signup-page {
            padding: 25px 15px;
        }

        .signup-card {
            padding: 30px 24px;
        }

        .signup-header h1 {
            font-size: 25px;
        }

    }

</style>


<div class="signup-page">

    <div class="signup-container">

        <div class="signup-card">

            <div class="signup-header">

                <div class="brand-mark">
                    PW
                </div>

                <h1>
                    Create your account
                </h1>

                <p>
                    Start your personalized learning journey.
                </p>

            </div>


            <form method="POST"
                  action="{{ url_for('main.register') }}"
                  class="signup-form">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-input"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="signup-button">

                    Create Account →

                </button>

            </form>


            <div class="login-divider">
                <span>or</span>
            </div>


            <p class="login-text">

                Already have an account?

                <a href="{{ url_for('main.login') }}">
                    Login here
                </a>

            </p>

        </div>


        <p class="signup-note">
            PathWise · Personalized Learning Path System
        </p>

    </div>

</div>


{% endblock %}
