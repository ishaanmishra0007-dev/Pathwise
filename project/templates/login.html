{% extends "base.html" %}

{% block title %}Login | PathWise{% endblock %}

{% block content %}

<style>
    .login-page {
        min-height: calc(100vh - 130px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
    }

    .login-container {
        width: 100%;
        max-width: 430px;
    }

    .login-card {
        background: #ffffff;
        border: 1px solid #dce2dc;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 8px 30px rgba(32, 41, 35, 0.08);
    }

    .login-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .brand-mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        border-radius: 10px;

        /* PathWise green */
        background: #3f6b57;

        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -1px;
    }

    .login-header h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;

        /* PathWise dark text */
        color: #202923;
    }

    .login-header p {
        margin: 0;

        /* PathWise secondary text */
        color: #68736b;

        font-size: 15px;
        line-height: 1.5;
    }

    .login-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group label {
        font-size: 14px;
        font-weight: 600;

        color: #37423b;
    }

    .input-wrapper {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);

        color: #9aa49d;

        font-size: 15px;
        pointer-events: none;
    }

    .form-input {
        width: 100%;
        box-sizing: border-box;

        padding: 13px 14px 13px 42px;

        border: 1px solid #cfd8d1;
        border-radius: 7px;

        background: #ffffff;
        color: #202923;

        font-size: 15px;
        outline: none;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    .form-input::placeholder {
        color: #9aa49d;
    }

    .form-input:focus {
        border-color: #3f6b57;

        box-shadow:
            0 0 0 3px rgba(63, 107, 87, 0.10);
    }

    .login-button {
        width: 100%;

        border: none;
        border-radius: 7px;

        padding: 14px 20px;
        margin-top: 4px;

        /* PathWise green */
        background: #3f6b57;

        color: #ffffff;

        font-size: 15px;
        font-weight: 600;

        cursor: pointer;

        transition:
            background 0.2s ease,
            transform 0.2s ease;
    }

    .login-button:hover {
        /* PathWise dark green */
        background: #315442;
    }

    .login-button:active {
        transform: translateY(1px);
    }

    .login-divider {
        display: flex;
        align-items: center;

        gap: 12px;
        margin: 26px 0 22px;

        color: #9aa49d;

        font-size: 13px;
    }

    .login-divider::before,
    .login-divider::after {
        content: "";
        flex: 1;

        height: 1px;

        background: #e1e5e1;
    }

    .register-text {
        text-align: center;

        margin: 0;

        color: #68736b;

        font-size: 14px;
    }

    .register-link {
        /* PathWise green */
        color: #3f6b57;

        font-weight: 600;
        text-decoration: none;
    }

    .register-link:hover {
        text-decoration: underline;
    }

    .login-note {
        text-align: center;

        margin-top: 22px;

        color: #9aa49d;

        font-size: 12px;
        line-height: 1.5;
    }

    @media (max-width: 500px) {

        .login-page {
            padding: 30px 15px;
        }

        .login-card {
            padding: 30px 24px;
        }

        .login-header h1 {
            font-size: 25px;
        }

    }
</style>


<div class="login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="login-header">

                <div class="brand-mark">
                    PW
                </div>

                <h1>Welcome back</h1>

                <p>
                    Sign in to continue your personalized learning journey.
                </p>

            </div>


            <form method="POST"
                  action="{{ url_for('main.login') }}"
                  class="login-form">

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-input"
                            placeholder="Enter your email"
                            required
                            autocomplete="email"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">●</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >

                    </div>

                </div>


                <button type="submit" class="login-button">
                    Login
                </button>

            </form>


            <div class="login-divider">
                <span>or</span>
            </div>


            <p class="register-text">

                Don't have an account?

                <a href="{{ url_for('main.register') }}"
                   class="register-link">

                    Create an account

                </a>

            </p>

        </div>


        <p class="login-note">
            PathWise · Personalized Learning Path System
        </p>

    </div>

</div>

{% endblock %}
